<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT Earn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .balance {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .balance-title {
      color: #777;
      font-size: 15px;
    }

    .amount {
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0;
    }

    .usdt {
      font-size: 16px;
      color: #16803c;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .earn {
      background: #16a34a;
      color: white;
    }

    .withdraw {
      background: #2563eb;
      color: white;
    }

    .referral {
      background: #f59e0b;
      color: white;
    }

    .info {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      line-height: 1.9;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>USDT Earn</h1>
    <p>کسب امتیاز و پاداش</p>
  </div>

  <div class="container">

    <div class="balance">
      <div class="balance-title">موجودی شما</div>

      <div class="amount" id="balance">
        0.00
      </div>

      <div class="usdt">
        USDT
      </div>
    </div>

    <div class="buttons">

      <button class="earn" onclick="earn()">
        💰 کسب پاداش
      </button>

      <button class="withdraw" onclick="withdraw()">
        💳 برداشت
      </button>

      <button class="referral" onclick="referral()">
        👥 دعوت دوستان
      </button>

    </div>

    <div class="info">
      <h3>📋 وضعیت حساب</h3>

      <p>امتیاز امروز: <strong id="points">0</strong></p>

      <p>تعداد دعوت‌ها: <strong id="friends">0</strong></p>

      <p>وضعیت: <strong>فعال</strong></p>
    </div>

  </div>

  <div class="footer">
    USDT Earn © 2026
  </div>

  <script>

    let balance = 0;
    let points = 0;
    let friends = 0;

    function earn() {
      points += 10;
      balance += 0.01;

      document.getElementById("points").textContent = points;
      document.getElementById("balance").textContent =
        balance.toFixed(2);

      alert("10 امتیاز به حساب شما اضافه شد.");
    }

    function withdraw() {
      alert("سیستم برداشت هنوز در حال ساخت است.");
    }

    function referral() {
      friends += 1;

      document.getElementById("friends").textContent = friends;

      alert("سیستم دعوت دوستان در مرحله بعد فعال می‌شود.");
    }

  </script>

</body>
</html>
