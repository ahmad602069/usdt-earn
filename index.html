<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">

<title>Escape From Bomb</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050a;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:
        radial-gradient(circle at 50% 20%,#10243b 0%,#050b14 45%,#010205 100%);
}

#hud{
    position:fixed;
    top:10px;
    left:8px;
    right:8px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.box{
    min-width:72px;
    padding:8px 10px;
    margin:2px;
    border-radius:10px;
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.16);
    color:white;
    text-align:center;
    font-size:15px;
    font-weight:bold;
}

#levelBox{
    position:fixed;
    top:58px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    padding:6px 14px;
    border-radius:20px;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:13px;
    font-weight:bold;
    pointer-events:none;
}

#fire{
    position:fixed;
    right:20px;
    bottom:24px;
    z-index:30;
    width:92px;
    height:92px;
    border-radius:50%;
    border:3px solid white;
    background:#d51d1d;
    color:white;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 0 22px rgba(255,0,0,.45);
}

#fire:active{
    transform:scale(.93);
}

#overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.76);
}

#panel{
    width:86%;
    max-width:380px;
    padding:26px 20px;
    border-radius:20px;
    background:linear-gradient(145deg,#101923,#05080d);
    border:1px solid rgba(255,255,255,.18);
    color:white;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.6);
}

#panel h1{
    margin-bottom:15px;
    font-size:28px;
}

#panel p{
    margin:8px 0;
    color:#d8d8d8;
}

#restart{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#159447;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#status{
    margin-top:12px;
    min-height:20px;
    color:#ffd45a;
    font-size:13px;
}
</style>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="box">
        ❤️ <span id="lives">3</span>
    </div>

    <div class="box">
        ⭐ <span id="score">0</span>
    </div>

    <div class="box">
        🪙 <span id="coins">0</span>
    </div>

</div>

<div id="levelBox">
    LEVEL <span id="level">1</span>
</div>

<button id="fire">FIRE</button>

<div id="overlay">

    <div id="panel">

        <h1>GAME OVER</h1>

        <p>
            Score:
            <strong id="finalScore">0</strong>
        </p>

        <p>
            Coins:
            <strong id="finalCoins">0</strong>
        </p>

        <p id="status">
            Watch an ad to play again.
        </p>

        <button id="restart">
            WATCH AD & PLAY AGAIN
        </button>

    </div>

</div>

<script>
"use strict";

/* Telegram */

try{
    if(window.Telegram && window.Telegram.WebApp){
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
}catch(error){
    console.log(error);
}


/* Canvas */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    const dpr=Math.min(window.devicePixelRatio || 1,2);

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    if(jet){
        jet.x=Math.max(35,Math.min(W-35,jet.x));
        jet.y=H-120;
    }
}

window.addEventListener("resize",resize);


/* Game state */

let playing=false;
let gameOverState=false;
let waitingForAd=false;

let score=0;
let coins=0;
let lives=3;

let gameTime=0;
let activeTimeSinceAd=0;

let lastFrame=performance.now();

let bombTimer=0;
let coinTimer=0;
let shootTimer=0;

let bombs=[];
let bullets=[];
let coinPacks=[];
let explosions=[];
let stars=[];


/* Jet */

const jet={
    x:window.innerWidth/2,
    y:window.innerHeight-120
};


/* Create stars */

function createStars(){

    stars=[];

    for(let i=0;i<100;i++){

        stars.push({
            x:Math.random()*W,
            y:Math.random()*H,
            size:.5+Math.random()*1.8,
            speed:15+Math.random()*45
        });

    }
}


/* Difficulty */

function getDifficulty(){

    const minutes=gameTime/60000;

    const level=Math.floor(minutes)+1;

    let bombSpeed=85+(minutes*24);

    let bombInterval=1200-(minutes*95);

    let fireInterval=430-(minutes*35);

    bombSpeed=Math.min(bombSpeed,220);
    bombInterval=Math.max(bombInterval,380);
    fireInterval=Math.max(fireInterval,150);

    return{
        level:level,
        bombSpeed:bombSpeed,
        bombInterval:bombInterval,
        fireInterval:fireInterval
    };
}


/* Jet drawing */

function drawJet(){

    ctx.save();

    ctx.translate(jet.x,jet.y);

    const flameSize=12+Math.random()*10;

    ctx.fillStyle="#ff7b00";

    ctx.beginPath();
    ctx.moveTo(-7,30);
    ctx.lineTo(0,30+flameSize);
    ctx.lineTo(7,30);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#9da8b5";

    ctx.beginPath();
    ctx.moveTo(0,-47);
    ctx.lineTo(-13,13);
    ctx.lineTo(-47,29);
    ctx.lineTo(-12,32);
    ctx.lineTo(0,42);
    ctx.lineTo(12,32);
    ctx.lineTo(47,29);
    ctx.lineTo(13,13);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#e2e7ec";

    ctx.beginPath();
    ctx.moveTo(0,-50);
    ctx.lineTo(10,12);
    ctx.lineTo(8,36);
    ctx.lineTo(0,43);
    ctx.lineTo(-8,36);
    ctx.lineTo(-10,12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#194a70";

    ctx.beginPath();
    ctx.ellipse(0,-22,7,14,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#626b75";
    ctx.fillRect(-3,-7,6,30);

    ctx.restore();
}


/* Bomb drawing */

function drawBomb(b){

    ctx.save();

    ctx.translate(b.x,b.y);

    ctx.fillStyle="#17191c";

    ctx.beginPath();
    ctx.arc(0,0,b.r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#666";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.strokeStyle="#ff9d00";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,-b.r);
    ctx.lineTo(5,-b.r-10);
    ctx.stroke();

    ctx.fillStyle="#ff3300";

    ctx.beginPath();
    ctx.arc(5,-b.r-11,3,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}


/* Bullet drawing */

function drawBullet(b){

    ctx.save();

    ctx.fillStyle="#ffffff";
    ctx.shadowColor="#00eaff";
    ctx.shadowBlur=12;

    ctx.fillRect(b.x-2,b.y,4,17);

    ctx.restore();
}


/* Coin drawing */

function drawCoin(c){

    ctx.save();

    ctx.fillStyle="#ffd700";

    ctx.beginPath();
    ctx.arc(c.x,c.y,11,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#fff1a0";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle="#7d5a00";
    ctx.font="bold 11px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("2",c.x,c.y);

    ctx.restore();
}


/* Explosion */

function drawExplosion(e){

    const progress=e.life/450;

    ctx.save();

    ctx.globalAlpha=1-progress;

    ctx.strokeStyle="#ff6a00";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        e.x,
        e.y,
        10+progress*48,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle="#ffd000";

    ctx.beginPath();

    ctx.arc(
        e.x,
        e.y,
        Math.max(2,18-progress*15),
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* Shooting */

function shoot(){

    if(!playing)return;

    const dual=gameTime>=300000;

    if(dual){

        bullets.push({
            x:jet.x-15,
            y:jet.y-48,
            speed:700
        });

        bullets.push({
            x:jet.x+15,
            y:jet.y-48,
            speed:700
        });

    }else{

        bullets.push({
            x:jet.x,
            y:jet.y-48,
            speed:700
        });

    }
}


/* Fire button */

let fireHeld=false;

const fireButton=document.getElementById("fire");

fireButton.addEventListener("pointerdown",function(e){

    e.preventDefault();

    fireHeld=true;

    shoot();

});

fireButton.addEventListener("pointerup",function(e){

    e.preventDefault();

    fireHeld=false;

});

fireButton.addEventListener("pointercancel",function(){

    fireHeld=false;

});

fireButton.addEventListener("pointerleave",function(){

    fireHeld=false;

});


/* Jet movement */

let dragging=false;

canvas.addEventListener("pointerdown",function(e){

    if(!playing)return;

    dragging=true;

    moveJet(e.clientX);

});

canvas.addEventListener("pointermove",function(e){

    if(!playing)return;

    if(dragging){

        moveJet(e.clientX);

    }

});

canvas.addEventListener("pointerup",function(){

    dragging=false;

});

canvas.addEventListener("pointercancel",function(){

    dragging=false;

});


function moveJet(x){

    jet.x=Math.max(
        35,
        Math.min(W-35,x)
    );

}


/* Bomb creation */

function createBomb(){

    const d=getDifficulty();

    bombs.push({

        x:30+Math.random()*(W-60),

        y:-35,

        r:15+Math.random()*7,

        speed:d.bombSpeed*(.85+Math.random()*.3)

    });

}


/* Coin creation */

function createCoin(){

    coinPacks.push({

        x:20+Math.random()*(W-40),

        y:-20,

        speed:95+Math.random()*25

    });

}


/* Explosion creation */

function explode(x,y){

    explosions.push({

        x:x,
        y:y,
        life:0

    });

}


/* Collision helper */

function hitDistance(a,b){

    const dx=a.x-b.x;
    const dy=a.y-b.y;

    return Math.sqrt(dx*dx+dy*dy);

}


/* HUD */

function updateHUD(){

    document.getElementById("lives").textContent=lives;
    document.getElementById("score").textContent=score;
    document.getElementById("coins").textContent=coins;

    const d=getDifficulty();

    document.getElementById("level").textContent=d.level;

}


/* Start */

function startGame(){

    playing=true;
    gameOverState=false;
    waitingForAd=false;

    score=0;
    coins=0;
    lives=3;

    gameTime=0;
    activeTimeSinceAd=0;

    bombTimer=0;
    coinTimer=0;
    shootTimer=0;

    bombs=[];
    bullets=[];
    coinPacks=[];
    explosions=[];

    jet.x=W/2;
    jet.y=H-120;

    document.getElementById("overlay").style.display="none";

    updateHUD();

}


/* Game over */

function endGame(){

    if(!playing)return;

    playing=false;
    gameOverState=true;

    document.getElementById("finalScore").textContent=score;
    document.getElementById("finalCoins").textContent=coins;

    document.getElementById("status").textContent=
        "Watch an ad to play again.";

    document.getElementById("restart").textContent=
        "WATCH AD & PLAY AGAIN";

    document.getElementById("overlay").style.display="flex";

}


/* AdsGram */

let adsgramController=null;

function setupAdsGram(){

    try{

        if(
            window.Adsgram &&
            typeof window.Adsgram.init==="function"
        ){

            adsgramController=window.Adsgram.init({
                blockId:"YOUR_BLOCK_ID"
            });

            console.log("AdsGram initialized");

        }else{

            console.log("AdsGram is not available");

        }

    }catch(error){

        console.log("AdsGram initialization error:",error);

        adsgramController=null;

    }

}


/* Show ad */

async function showRewardedAd(){

    if(
        !adsgramController ||
        typeof adsgramController.show!=="function"
    ){

        return false;

    }

    try{

        const result=await adsgramController.show();

        return !!(
            result &&
            result.done===true
        );

    }catch(error){

        console.log("Ad error:",error);

        return false;

    }

}


/* Restart after ad */

document.getElementById("restart").addEventListener(
    "click",
    async function(){

        if(waitingForAd)return;

        waitingForAd=true;

        const button=document.getElementById("restart");
        const status=document.getElementById("status");

        button.disabled=true;
        button.textContent="LOADING AD...";
        status.textContent="Please wait...";

        const completed=await showRewardedAd();

        if(completed){

            startGame();

        }else{

            status.textContent=
                "The ad was not completed. Please try again.";

            button.disabled=false;
            button.textContent="WATCH AD & PLAY AGAIN";

            waitingForAd=false;

        }

    }
);


/* Five minute ad */

async function fiveMinuteAd(){

    if(!playing)return;

    playing=false;

    waitingForAd=true;

    document.getElementById("status").textContent=
        "Complete the ad to continue.";

    document.getElementById("restart").textContent=
        "WATCH AD";

    document.getElementById("restart").disabled=true;

    document.getElementById("overlay").style.display="flex";

    const completed=await showRewardedAd();

    if(completed){

        activeTimeSinceAd=0;

        waitingForAd=false;

        document.getElementById("overlay").style.display="none";

        document.getElementById("restart").disabled=false;

        playing=true;

    }else{

        document.getElementById("status").textContent=
            "The ad was not completed.";

        document.getElementById("restart").disabled=false;

        document.getElementById("restart").textContent=
            "WATCH AD";

        waitingForAd=false;

    }

}


/* Update */

function update(dt){

    if(!playing)return;

    gameTime+=dt;
    activeTimeSinceAd+=dt;

    const d=getDifficulty();

    /* Automatic fire */

    shootTimer+=dt;

    if(shootTimer>=d.fireInterval){

        shoot();

        shootTimer=0;

    }

    /* FIRE hold */

    if(fireHeld){

        shootTimer+=dt;

    }

    /* Bombs */

    bombTimer+=dt;

    if(bombTimer>=d.bombInterval){

        createBomb();

        bombTimer=0;

    }

    /* Coins */

    coinTimer+=dt;

    if(coinTimer>=2400){

        createCoin();

        coinTimer=0;

    }

    /* Stars */

    for(const star of stars){

        star.y+=star.speed*dt/1000;

        if(star.y>H){

            star.y=-5;
            star.x=Math.random()*W;

        }

    }

    /* Bullets */

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.y-=b.speed*dt/1000;

        if(b.y<-30){

            bullets.splice(i,1);
            continue;

        }

        let destroyed=false;

        for(let j=bombs.length-1;j>=0;j--){

            const bomb=bombs[j];

            if(
                Math.abs(b.x-bomb.x)<bomb.r+6 &&
                Math.abs(b.y-bomb.y)<bomb.r+12
            ){

                explode(bomb.x,bomb.y);

                bombs.splice(j,1);
                bullets.splice(i,1);

                score+=10;

                destroyed=true;

                break;

            }

        }

        if(destroyed)continue;

    }

    /* Bombs */

    for(let i=bombs.length-1;i>=0;i--){

        const bomb=bombs[i];

        bomb.y+=bomb.speed*dt/1000;

        const distance=hitDistance(
            {x:bomb.x,y:bomb.y},
            {x:jet.x,y:jet.y}
        );

        if(distance<bomb.r+28){

            explode(bomb.x,bomb.y);

            bombs.splice(i,1);

            lives--;

            updateHUD();

            if(lives<=0){

                endGame();
                return;

            }

            continue;

        }

        if(bomb.y>H+50){

            bombs.splice(i,1);

            lives--;

            updateHUD();

            if(lives<=0){

                endGame();
                return;

            }

        }

    }

    /* Coins */

    for(let i=coinPacks.length-1;i>=0;i--){

        const coin=coinPacks[i];

        coin.y+=coin.speed*dt/1000;

        const distance=hitDistance(
            {x:coin.x,y:coin.y},
            {x:jet.x,y:jet.y}
        );

        if(distance<42){

            coins+=2;

            coinPacks.splice(i,1);

            updateHUD();

            continue;

        }

        if(coin.y>H+40){

            coinPacks.splice(i,1);

        }

    }

    /* Explosions */

    for(let i=explosions.length-1;i>=0;i--){

        explosions[i].life+=dt;

        if(explosions[i].life>=450){

            explosions.splice(i,1);

        }

    }

    /* Five minute active-time ad */

    if(activeTimeSinceAd>=300000){

        fiveMinuteAd();

    }

    updateHUD();

}


/* Draw */

function draw(){

    ctx.clearRect(0,0,W,H);

    /* Background */

    const gradient=ctx.createLinearGradient(
        0,0,0,H
    );

    gradient.addColorStop(0,"#08192b");
    gradient.addColorStop(.55,"#030912");
    gradient.addColorStop(1,"#010204");

    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,W,H);

    /* Stars */

    ctx.fillStyle="#ffffff";

    for(const star of stars){

        ctx.globalAlpha=.2+Math.random()*.5;

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );

    }

    ctx.globalAlpha=1;

    /* Coins */

    for(const coin of coinPacks){

        drawCoin(coin);

    }

    /* Bombs */

    for(const bomb of bombs){

        drawBomb(bomb);

    }

    /* Bullets */

    for(const bullet of bullets){

        drawBullet(bullet);

    }

    /* Explosions */

    for(const explosion of explosions){

        drawExplosion(explosion);

    }

    /* Jet */

    drawJet();

}


/* Main loop */

function loop(now){

    const dt=Math.min(
        50,
        Math.max(0,now-lastFrame)
    );

    lastFrame=now;

    update(dt);
    draw();

    requestAnimationFrame(loop);

}


/* Initialize */

resize();
createStars();
setupAdsGram();
startGame();
requestAnimationFrame(loop);

console.log("Escape From Bomb started");
</script>

</body>
</html>
