<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>فرار از بمب</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050914;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#topBar{
  position:fixed;
  top:8px;
  left:8px;
  right:8px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.info{
  background:rgba(10,18,35,.9);
  border:1px solid #34425f;
  border-radius:12px;
  padding:7px 9px;
  color:white;
  font-size:13px;
}

#lives{
  font-size:17px;
}

#fireButton{
  position:fixed;
  bottom:22px;
  right:18px;
  z-index:20;

  width:82px;
  height:82px;
  border-radius:50%;

  border:3px solid rgba(255,255,255,.3);

  background:#dc2626;
  color:white;

  font-weight:bold;
  font-size:16px;

  box-shadow:0 0 22px rgba(255,50,50,.5);
}

#fireButton:active{
  transform:scale(.9);
}

.screen{
  position:fixed;
  inset:0;
  z-index:50;

  display:flex;
  justify-content:center;
  align-items:center;

  background:rgba(2,5,12,.94);
}

.panel{
  width:90%;
  max-width:390px;

  background:#111a2d;
  border:1px solid #3b4b6c;

  border-radius:22px;

  padding:28px 20px;

  text-align:center;
  color:white;
}

.panel h1{
  margin:0 0 15px;
  font-size:29px;
}

.panel p{
  color:#b9c5dc;
  line-height:1.8;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 26px;

  background:#2563eb;
  color:white;

  font-size:17px;
  font-weight:bold;
}

#gameOver{
  display:none;
}

#adMessage{
  position:fixed;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:100;

  display:none;

  width:85%;
  max-width:350px;

  padding:22px;

  border-radius:18px;

  background:#111827;
  color:white;

  text-align:center;

  border:1px solid #3b4d72;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="topBar">

  <div class="info">
    🪙 <span id="coins">0</span>
  </div>

  <div class="info">
    امتیاز:
    <span id="score">0</span>
  </div>

  <div class="info">
    مرحله:
    <span id="level">1</span>
  </div>

  <div class="info" id="lives">
    ❤️❤️❤️
  </div>

</div>

<button id="fireButton">
🔥<br>FIRE
</button>

<div id="startScreen" class="screen">

  <div class="panel">

    <h1>✈️ فرار از بمب</h1>

    <p>
      جت را با کشیدن انگشت به چپ و راست حرکت بده.<br>
      فایر خودکار است.<br>
      برای شلیک دستی FIRE را بزن.
    </p>

    <button id="startButton">
      ▶️ شروع بازی
    </button>

  </div>

</div>

<div id="gameOver" class="screen">

  <div class="panel">

    <h1>💥 بازی تمام شد</h1>

    <p>
      امتیاز:
      <strong id="finalScore">0</strong>
    </p>

    <p>
      🪙 سکه:
      <strong id="finalCoins">0</strong>
    </p>

    <button id="againButton">
      📺 تبلیغ و بازی دوباره
    </button>

  </div>

</div>

<div id="adMessage">
  <h3>📺 تبلیغ</h3>
  <p>
    برای ادامه بازی باید تبلیغ کامل شود.
  </p>
</div>

<script>

/* ================================
Telegram
================================ */

if(window.Telegram && Telegram.WebApp){

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

}


/* ================================
AdsGram
================================ */

/*
  اینجا Block ID واقعی AdsGram را قرار بده.
*/

const ADSGRAM_BLOCK_ID =
"YOUR_BLOCK_ID";

let adController=null;


function initAds(){

  try{

    if(
      window.Adsgram &&
      ADSGRAM_BLOCK_ID !== "YOUR_BLOCK_ID"
    ){

      adController=
        window.Adsgram.init({
          blockId:ADSGRAM_BLOCK_ID
        });

      return true;
    }

  }catch(e){

    console.log(e);

  }

  return false;
}


async function showAd(){

  const box=
    document.getElementById("adMessage");

  box.style.display="block";


  if(ADSGRAM_BLOCK_ID==="YOUR_BLOCK_ID"){

    box.innerHTML=`
      <h3>⚠️ تبلیغ هنوز وصل نشده</h3>
      <p>
        Block ID AdsGram را وارد کن.
      </p>
    `;

    return false;
  }


  try{

    if(!adController){

      initAds();

    }

    if(!adController){

      throw new Error("AdsGram unavailable");

    }

    const result=
      await adController.show();


    box.style.display="none";

    return true;

  }catch(e){

    console.log("AdsGram:",e);

    box.innerHTML=`
      <h3>⚠️ تبلیغ موجود نیست</h3>
      <p>
        فعلاً تبلیغ بارگذاری نشد.
      </p>
    `;

    return false;
  }

}


/* ================================
Canvas
================================ */

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");

let W=0;
let H=0;


function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  const dpr=
    window.devicePixelRatio || 1;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* ================================
Game
================================ */

let playing=false;

let score=0;
let coins=0;
let lives=3;
let level=1;

let bombs=[];
let bullets=[];
let coinPacks=[];
let particles=[];

let bombTimer=0;
let shootTimer=0;
let coinTimer=0;

let gameTime=0;
let lastTime=0;

let fireInterval=360;
let bombInterval=900;

const AD_INTERVAL=5*60*1000;

let adTime=0;


/* ================================
Jet
================================ */

const player={

  x:0,

  targetX:0,

  y:0,

  width:56,

  height:72

};


/* ================================
Reset
================================ */

function resetGame(){

  score=0;

  coins=0;

  lives=3;

  level=1;

  bombs=[];
  bullets=[];
  coinPacks=[];
  particles=[];

  bombTimer=0;
  shootTimer=0;
  coinTimer=0;

  gameTime=0;
  adTime=0;

  fireInterval=360;
  bombInterval=900;

  player.x=W/2;
  player.targetX=W/2;
  player.y=H-105;

  updateUI();

}


/* ================================
UI
================================ */

function updateUI(){

  document.getElementById("score")
    .textContent=score;

  document.getElementById("coins")
    .textContent=coins;

  document.getElementById("level")
    .textContent=level;


  let h="";

  for(let i=0;i<3;i++){

    h += i<lives ? "❤️" : "🖤";

  }

  document.getElementById("lives")
    .textContent=h;

}


/* ================================
Start
================================ */

function startGame(){

  resetGame();

  playing=true;

  document.getElementById("startScreen")
    .style.display="none";

  document.getElementById("gameOver")
    .style.display="none";

  lastTime=performance.now();

  requestAnimationFrame(gameLoop);

}


/* ================================
Game Over
================================ */

function endGame(){

  playing=false;

  document.getElementById("finalScore")
    .textContent=score;

  document.getElementById("finalCoins")
    .textContent=coins;

  document.getElementById("gameOver")
    .style.display="flex";

}


/* ================================
Difficulty
================================ */

function updateDifficulty(){

  /*
    سختی بر اساس دقیقه بازی.

    دقیقه 1:
    آسان

    دقیقه 6:
    خیلی سخت ولی هنوز قابل بازی
  */

  const minutes=
    gameTime/60;

  const difficulty=
    Math.min(minutes/6,1);


  /*
    بمب‌ها سریع‌تر
  */

  bombInterval=
    Math.max(
      430,
      900-
      difficulty*470
    );


  /*
    سرعت فایر بیشتر
  */

  fireInterval=
    Math.max(
      190,
      360-
      difficulty*170
    );


  /*
    هر دقیقه مرحله
  */

  level=
    Math.floor(minutes)+1;


  /*
    از دقیقه 5:
    دو گلوله
  */

}


/* ================================
Bomb
================================ */

function spawnBomb(){

  const r=
    16+
    Math.random()*9;


  bombs.push({

    x:
      r+
      Math.random()*
      (W-r*2),

    y:
      -r-20,

    r:r,

    speed:
      145+
      gameTime*7+
      Math.random()*55,

    rotation:
      Math.random()*Math.PI*2

  });

}


/* ================================
Coins
================================ */

function spawnCoinPack(){

  /*
    تقریباً 25 بسته در هر دقیقه.

    فاصله متوسط:
    حدود 2.4 ثانیه
  */

  coinPacks.push({

    x:
      22+
      Math.random()*
      (W-44),

    y:-30,

    r:14,

    speed:
      125+
      gameTime*4

  });

}


/* ================================
Fire
================================ */

function fire(){

  if(!playing)
    return;


  /*
    قبل از دقیقه 5:
    یک گلوله

    دقیقه 5 به بعد:
    دو گلوله همزمان
  */

  if(gameTime>=300){

    bullets.push({

      x:player.x-12,

      y:player.y-37,

      width:5,

      height:20,

      speed:700

    });


    bullets.push({

      x:player.x+12,

      y:player.y-37,

      width:5,

      height:20,

      speed:700

    });

  }else{

    bullets.push({

      x:player.x,

      y:player.y-37,

      width:5,

      height:20,

      speed:700

    });

  }

}


/* ================================
Explosion
================================ */

function explosion(x,y){

  for(let i=0;i<18;i++){

    const a=
      Math.random()*Math.PI*2;

    const s=
      60+Math.random()*170;

    particles.push({

      x:x,
      y:y,

      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,

      life:.55,

      size:
        2+
        Math.random()*4

    });

  }

}


/* ================================
Update
================================ */

function update(dt){

  gameTime+=dt;

  adTime+=dt*1000;


  /*
    Difficulty
  */

  updateDifficulty();


  /*
    جت
  */

  player.x +=
    (
      player.targetX-
      player.x
    )*
    Math.min(1,dt*12);


  const half=
    player.width/2;


  if(player.x<half)
    player.x=half;

  if(player.x>W-half)
    player.x=W-half;


  /*
    خودکار فایر
  */

  shootTimer+=dt*1000;


  if(shootTimer>=fireInterval){

    shootTimer=0;

    fire();

  }


  /*
    بمب
  */

  bombTimer+=dt*1000;


  if(bombTimer>=bombInterval){

    bombTimer=0;

    spawnBomb();

  }


  /*
    بسته‌های سکه

    25 عدد تقریبی در دقیقه
  */

  coinTimer+=dt*1000;


  if(coinTimer>=2400){

    coinTimer=0;

    spawnCoinPack();

  }


  /*
    تبلیغ هر 5 دقیقه
  */

  if(adTime>=AD_INTERVAL){

    adTime=0;

    playing=false;

    showAd().then(success=>{

      if(success){

        playing=true;

        lastTime=performance.now();

        requestAnimationFrame(gameLoop);

      }

    });

    return;

  }


  /*
    Bullets
  */

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const b=bullets[i];

    b.y-=b.speed*dt;


    if(b.y<-30){

      bullets.splice(i,1);

    }

  }


  /*
    Bombs
  */

  for(
    let i=bombs.length-1;
    i>=0;
    i--
  ){

    const b=bombs[i];

    b.y+=b.speed*dt;

    b.rotation+=dt*2;


    /*
      بمب رد شد
    */

    if(b.y-b.r>H){

      bombs.splice(i,1);

      lives--;

      updateUI();


      if(lives<=0){

        endGame();

        return;

      }

    }

  }


  /*
    Coin Packs
  */

  for(
    let i=coinPacks.length-1;
    i>=0;
    i--
  ){

    const c=coinPacks[i];

    c.y+=c.speed*dt;


    /*
      برخورد با جت
    */

    const dx=
      c.x-player.x;

    const dy=
      c.y-player.y;

    const dist=
      Math.sqrt(dx*dx+dy*dy);


    if(dist<35){

      /*
        هر بسته = 2 سکه
      */

      coins+=2;

      coinPacks.splice(i,1);

      updateUI();

      continue;

    }


    /*
      از پایین رد شد
    */

    if(c.y>H+40){

      coinPacks.splice(i,1);

    }

  }


  /*
    Bullet vs Bomb
  */

  for(
    let i=bombs.length-1;
    i>=0;
    i--
  ){

    const bomb=bombs[i];


    for(
      let j=bullets.length-1;
      j>=0;
      j--
    ){

      const bullet=
        bullets[j];


      const dx=
        bomb.x-bullet.x;

      const dy=
        bomb.y-bullet.y;


      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      if(
        distance<
        bomb.r+9
      ){

        explosion(
          bomb.x,
          bomb.y
        );


        bombs.splice(i,1);

        bullets.splice(j,1);

        score++;


        updateUI();

        break;

      }

    }

  }


  /*
    Particles
  */

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx*dt;

    p.y+=p.vy*dt;

    p.vy+=180*dt;

    p.life-=dt;


    if(p.life<=0){

      particles.splice(i,1);

    }

  }

}


/* ================================
Background
================================ */

function drawBackground(){

  ctx.fillStyle="#050914";

  ctx.fillRect(
    0,0,W,H
  );


  /*
    ستاره‌ها
  */

  ctx.fillStyle=
    "rgba(255,255,255,.35)";


  for(
    let i=0;
    i<65;
    i++
  ){

    const x=(i*83)%W;

    const y=(i*137)%H;

    ctx.beginPath();

    ctx.arc(
      x,y,
      1,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* ================================
Jet
================================ */

function drawJet(){

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );


  /*
    شعله
  */

  ctx.fillStyle="#ff7a00";

  ctx.beginPath();

  ctx.moveTo(-7,28);

  ctx.lineTo(0,50);

  ctx.lineTo(7,28);

  ctx.closePath();

  ctx.fill();


  /*
    بال چپ
  */

  ctx.fillStyle="#2563eb";

  ctx.beginPath();

  ctx.moveTo(-8,-5);

  ctx.lineTo(-36,28);

  ctx.lineTo(-10,20);

  ctx.closePath();

  ctx.fill();


  /*
    بال راست
  */

  ctx.beginPath();

  ctx.moveTo(8,-5);

  ctx.lineTo(36,28);

  ctx.lineTo(10,20);

  ctx.closePath();

  ctx.fill();


  /*
    بدنه
  */

  ctx.fillStyle="#e5e7eb";

  ctx.beginPath();

  ctx.moveTo(0,-37);

  ctx.lineTo(13,20);

  ctx.lineTo(0,32);

  ctx.lineTo(-13,20);

  ctx.closePath();

  ctx.fill();


  /*
    کابین
  */

  ctx.fillStyle="#0ea5e9";

  ctx.beginPath();

  ctx.ellipse(
    0,-14,
    6,12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    نوک جت
  */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.moveTo(0,-37);

  ctx.lineTo(4,-24);

  ctx.lineTo(-4,-24);

  ctx.closePath();

  ctx.fill();


  ctx.restore();

}


/* ================================
Bullets
================================ */

function drawBullets(){

  for(
    const b of bullets
  ){

    ctx.save();

    ctx.fillStyle="#ffe600";

    ctx.shadowColor="#ffe600";

    ctx.shadowBlur=12;

    ctx.fillRect(
      b.x-b.width/2,
      b.y,
      b.width,
      b.height
    );

    ctx.restore();

  }

}


/* ================================
Bombs
================================ */

function drawBombs(){

  for(
    const b of bombs
  ){

    ctx.save();

    ctx.translate(
      b.x,
      b.y
    );

    ctx.rotate(
      b.rotation
    );


    ctx.fillStyle="#151515";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();


    /*
      علامت X
    */

    ctx.strokeStyle="#ef4444";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      -b.r*.55,
      -b.r*.55
    );

    ctx.lineTo(
      b.r*.55,
      b.r*.55
    );

    ctx.moveTo(
      b.r*.55,
      -b.r*.55
    );

    ctx.lineTo(
      -b.r*.55,
      b.r*.55
    );

    ctx.stroke();


    /*
      فتیله
    */

    ctx.strokeStyle="#f59e0b";

    ctx.beginPath();

    ctx.moveTo(
      0,
      -b.r
    );

    ctx.quadraticCurveTo(
      8,
      -b.r-10,
      13,
      -b.r-5
    );

    ctx.stroke();


    ctx.restore();

  }

}


/* ================================
Coins
================================ */

function drawCoins(){

  for(
    const c of coinPacks
  ){

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );


    /*
      بسته جایزه
    */

    ctx.fillStyle="#f59e0b";

    ctx.fillRect(
      -15,
      -12,
      30,
      24
    );


    ctx.strokeStyle="#fde68a";

    ctx.lineWidth=3;

    ctx.strokeRect(
      -15,
      -12,
      30,
      24
    );


    /*
      سکه داخل بسته
    */

    ctx.fillStyle="#ffe066";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#7c4a03";

    ctx.font="bold 9px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "2",
      0,
      0
    );


    ctx.restore();

  }

}


/* ================================
Particles
================================ */

function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/.55
      );

    ctx.fillStyle="#ffb000";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

}


/* ================================
Draw
================================ */

function draw(){

  drawBackground();

  drawCoins();

  drawBullets();

  drawBombs();

  drawParticles();

  drawJet();

}


/* ================================
Game Loop
================================ */

function gameLoop(time){

  if(!playing)
    return;


  const dt=
    Math.min(
      .033,
      (time-lastTime)/1000
    );


  lastTime=time;


  update(dt);

  draw();


  if(playing){

    requestAnimationFrame(
      gameLoop
    );

  }

}


/* ================================
Touch
================================ */

function moveJet(x){

  if(!playing)
    return;

  player.targetX=x;

}


canvas.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    if(e.touches.length){

      moveJet(
        e.touches[0].clientX
      );

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  function(e){

    e.preventDefault();

    if(e.touches.length){

      moveJet(
        e.touches[0].clientX
      );

    }

  },
  {passive:false}
);


/* ================================
FIRE Button
================================ */

const fireButton=
document.getElementById(
  "fireButton"
);

let fireHolding=false;
let fireTimer=null;


fireButton.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    fire();

    fireHolding=true;

    fireTimer=setInterval(
      function(){

        if(
          fireHolding &&
          playing
        ){

          fire();

        }

      },
      160
    );

  }
);


function stopFire(){

  fireHolding=false;

  if(fireTimer){

    clearInterval(
      fireTimer
    );

    fireTimer=null;

  }

}


fireButton.addEventListener(
  "pointerup",
  stopFire
);

fireButton.addEventListener(
  "pointercancel",
  stopFire
);

fireButton.addEventListener(
  "pointerleave",
  stopFire
);

.getElementById("startButton")
.addEventListener(
  "click",
  startGame
);


document
.getElementById("againButton")
.addEventListener(
  "click",
  async function(){

    const success=
      await showAd();

    if(success){

      startGame();

    }

  }
);
