<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Escape From Bomb</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050914;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#050914;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    z-index:5;
    color:white;
    font-weight:bold;
    font-size:16px;
    pointer-events:none;
}

.hudBox{
    background:rgba(0,0,0,.55);
    padding:8px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
}

#fireButton{
    position:fixed;
    right:20px;
    bottom:25px;
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid white;
    background:#d71920;
    color:white;
    font-size:18px;
    font-weight:bold;
    z-index:10;
    box-shadow:0 0 20px rgba(255,0,0,.5);
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(2,5,12,.92);
    color:white;
    text-align:center;
}

.panel{
    width:min(90%,380px);
    padding:28px 20px;
    border-radius:20px;
    background:#101827;
    border:1px solid #26354d;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.panel h1{
    font-size:30px;
    margin-bottom:12px;
}

.panel p{
    color:#b9c4d4;
    line-height:1.5;
    margin-bottom:20px;
}

.mainButton{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#168cff;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:15;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudBox">❤️ <span id="lives">3</span></div>
    <div class="hudBox">🪙 <span id="coins">0</span></div>
    <div class="hudBox">⭐ <span id="score">0</span></div>
    <div class="hudBox">⏱️ <span id="time">0:00</span></div>
</div>

<button id="fireButton">FIRE</button>

<div id="message"></div>

<div id="menu">
    <div class="panel">
        <h1>ESCAPE FROM BOMB</h1>
        <p id="menuText">
            Move the fighter jet left and right.<br>
            Destroy bombs and collect coins.<br>
            You have 3 lives.
        </p>
        <button class="mainButton" id="startButton">START GAME</button>
    </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const livesEl = document.getElementById("lives");
const coinsEl = document.getElementById("coins");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const menu = document.getElementById("menu");
const menuText = document.getElementById("menuText");
const startButton = document.getElementById("startButton");
const fireButton = document.getElementById("fireButton");
const message = document.getElementById("message");

let W = 0;
let H = 0;

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

const jet = {
    x:0,
    y:0,
    width:54,
    height:72,
    targetX:0
};

let bullets = [];
let bombs = [];
let coins = [];

let lives = 3;
let score = 0;
let coinCount = 0;

let playing = false;
let gameOver = false;

let startTime = 0;
let lastFrame = 0;
let lastBombTime = 0;
let lastCoinTime = 0;
let lastFireTime = 0;

let fireHeld = false;
let dragging = false;

let adController = null;

const ADSGRAM_BLOCK_ID = "YOUR_BLOCK_ID";

function setupAds(){
    if(
        ADSGRAM_BLOCK_ID === "YOUR_BLOCK_ID" ||
        !window.Adsgram
    ){
        return;
    }

    try{
        adController = window.Adsgram.init({
            blockId: ADSGRAM_BLOCK_ID
        });
    }catch(e){
        adController = null;
    }
}

setupAds();

async function showRewardAd(){
    if(!adController){
        return true;
    }

    try{
        const result = await adController.show();

        if(result && result.done === false){
            return false;
        }

        return true;
    }catch(e){
        return false;
    }
}

function resetGame(){
    lives = 3;
    score = 0;
    coinCount = 0;

    bullets = [];
    bombs = [];
    coins = [];

    jet.x = W / 2;
    jet.targetX = W / 2;
    jet.y = H - 115;

    startTime = performance.now();
    lastBombTime = startTime;
    lastCoinTime = startTime;
    lastFireTime = startTime;

    gameOver = false;
    playing = true;

    menu.style.display = "none";

    updateHud();
}

function updateHud(){
    livesEl.textContent = lives;
    coinsEl.textContent = coinCount;
    scoreEl.textContent = score;

    let seconds = Math.floor(
        (performance.now() - startTime) / 1000
    );

    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    timeEl.textContent =
        min + ":" + String(sec).padStart(2,"0");
}

function difficulty(){
    const seconds = (performance.now() - startTime) / 1000;
    const minute = seconds / 60;

    return {
        bombSpeed: Math.min(230 + minute * 28,390),
        bombInterval: Math.max(850 - minute * 65,430),
        fireInterval: Math.max(360 - minute * 25,145)
    };
}

function createBomb(){
    const size = 24 + Math.random() * 16;

    bombs.push({
        x:size + Math.random() * (W - size * 2),
        y:-size,
        r:size,
        speed:difficulty().bombSpeed *
            (0.85 + Math.random() * 0.3),
        rotation:Math.random() * Math.PI
    });
}

function createCoin(){
    const size = 10;

    coins.push({
        x:size + Math.random() * (W - size * 2),
        y:-size,
        r:size,
        speed:100 + Math.random() * 45
    });
}

function fire(){
    if(!playing) return;

    const now = performance.now();
    const d = difficulty();

    if(now - lastFireTime < d.fireInterval){
        return;
    }

    lastFireTime = now;

    const dual =
        (now - startTime) / 1000 >= 300;

    if(dual){
        bullets.push({
            x:jet.x - 18,
            y:jet.y - 32,
            speed:720
        });

        bullets.push({
            x:jet.x + 18,
            y:jet.y - 32,
            speed:720
        });
    }else{
        bullets.push({
            x:jet.x,
            y:jet.y - 35,
            speed:720
        });
    }
}

function drawBackground(){
    const gradient = ctx.createLinearGradient(
        0,0,0,H
    );

    gradient.addColorStop(0,"#061329");
    gradient.addColorStop(1,"#02040a");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = "rgba(255,255,255,.6)";

    for(let i=0;i<45;i++){
        const x = (i * 97) % W;
        const y = (i * 173) % H;

        ctx.fillRect(x,y,1.5,1.5);
    }
}

function drawJet(){
    ctx.save();

    ctx.translate(jet.x,jet.y);

    ctx.fillStyle = "#aeb8c4";
    ctx.beginPath();
    ctx.moveTo(0,-38);
    ctx.lineTo(-14,12);
    ctx.lineTo(-28,28);
    ctx.lineTo(-8,24);
    ctx.lineTo(-5,38);
    ctx.lineTo(5,38);
    ctx.lineTo(8,24);
    ctx.lineTo(28,28);
    ctx.lineTo(14,12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#26384b";
    ctx.beginPath();
    ctx.moveTo(0,-28);
    ctx.lineTo(-7,-5);
    ctx.lineTo(7,-5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#4db3ff";
    ctx.beginPath();
    ctx.moveTo(-7,23);
    ctx.lineTo(-2,42);
    ctx.lineTo(2,42);
    ctx.lineTo(7,23);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawBullet(b){
    ctx.fillStyle = "#ffe44d";
    ctx.fillRect(
        b.x - 2,
        b.y - 12,
        4,
        12
    );
}

function drawBomb(b){
    ctx.save();

    ctx.translate(b.x,b.y);
    ctx.rotate(b.rotation);

    ctx.fillStyle = "#20252c";
    ctx.beginPath();
    ctx.arc(0,0,b.r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "#5b6570";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "#ff4b3e";
    ctx.beginPath();
    ctx.arc(
        -b.r * .3,
        -b.r * .3,
        4,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
}

function drawCoin(c){
    ctx.save();

    ctx.translate(c.x,c.y);

    ctx.fillStyle = "#ffd43b";
    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "#fff0a3";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#8c6500";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("2",0,1);

    ctx.restore();
}

function distance(a,b){
    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx*dx + dy*dy);
}

function update(dt){
    if(!playing) return;

    const now = performance.now();
    const d = difficulty();

    jet.x += (jet.targetX - jet.x) * Math.min(1,dt * 12);

    if(jet.x < 30) jet.x = 30;
    if(jet.x > W - 30) jet.x = W - 30;

    if(now - lastBombTime >= d.bombInterval){
        createBomb();
        lastBombTime = now;
    }

    if(now - lastCoinTime >= 2400){
        createCoin();
        lastCoinTime = now;
    }

    if(fireHeld){
        fire();
    }

    for(let i=bullets.length-1;i>=0;i--){
        const b = bullets[i];

        b.y -= b.speed * dt;

        if(b.y < -30){
            bullets.splice(i,1);
        }
    }

    for(let i=bombs.length-1;i>=0;i--){
        const b = bombs[i];

        b.y += b.speed * dt;
        b.rotation += dt;

        if(b.y > H + b.r){
            bombs.splice(i,1);

            lives--;

            if(lives <= 0){
                endGame();
                return;
            }

            continue;
        }

        if(
            distance(
                {x:jet.x,y:jet.y},
                {x:b.x,y:b.y}
            ) < b.r + 28
        ){
            bombs.splice(i,1);

            lives--;

            if(lives <= 0){
                endGame();
                return;
            }

            continue;
        }

        for(let j=bullets.length-1;j>=0;j--){
            const bullet = bullets[j];

            if(
                distance(
                    {x:bullet.x,y:bullet.y},
                    {x:b.x,y:b.y}
                ) < b.r + 8
            ){
                bombs.splice(i,1);
                bullets.splice(j,1);

                score += 10;
                break;
            }
        }
    }

    for(let i=coins.length-1;i>=0;i--){
        const c = coins[i];

        c.y += c.speed * dt;

        if(c.y > H + 30){
            coins.splice(i,1);
            continue;
        }

        if(
            distance(
                {x:jet.x,y:jet.y},
                {x:c.x,y:c.y}
            ) < 38
        ){
            coins.splice(i,1);
            coinCount += 2;
        }
    }

    updateHud();
}

function draw(){
    drawBackground();

    for(const c of coins){
        drawCoin(c);
    }

    for(const b of bombs){
        drawBomb(b);
    }

    for(const b of bullets){
        drawBullet(b);
    }

    if(playing){
        drawJet();
    }
}

function gameLoop(now){
    if(!lastFrame){
        lastFrame = now;
    }

    const dt = Math.min(
        (now - lastFrame) / 1000,
        0.033
    );

    lastFrame = now;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

function endGame(){
    playing = false;
    gameOver = true;

    menu.style.display = "flex";

    menuText.innerHTML =
        "GAME OVER<br><br>" +
        "Score: " + score +
        "<br>Coins: " + coinCount +
        "<br><br>You must watch an ad before playing again.";

    startButton.textContent = "WATCH AD & PLAY AGAIN";
}

async function startAfterAd(){
    startButton.disabled = true;
    startButton.textContent = "LOADING AD...";

    const watched = await showRewardAd();

    if(watched){
        startButton.disabled = false;
        startButton.textContent = "START GAME";
        resetGame();
    }else{
        startButton.disabled = false;
        startButton.textContent =
            gameOver
            ? "WATCH AD & PLAY AGAIN"
            : "START GAME";

        if(gameOver){
            menuText.innerHTML =
                "Please watch the advertisement completely before starting again.";
        }
    }
}

startButton.addEventListener("click",()=>{
    if(gameOver){
        startAfterAd();
    }else{
        resetGame();
    }
});

function setJetPosition(clientX){
    jet.targetX = Math.max(
        25,
        Math.min(W - 25,clientX)
    );
}

canvas.addEventListener("touchstart",(e)=>{
    if(!playing) return;

    dragging = true;

    const touch = e.touches[0];

    setJetPosition(touch.clientX);
},{passive:false});

canvas.addEventListener("touchmove",(e)=>{
    if(!playing || !dragging) return;

    e.preventDefault();

    const touch = e.touches[0];

    setJetPosition(touch.clientX);
},{passive:false});

canvas.addEventListener("touchend",()=>{
    dragging = false;
},{passive:false});

canvas.addEventListener("mousedown",(e)=>{
    if(!playing) return;

    dragging = true;
    setJetPosition(e.clientX);
});

window.addEventListener("mousemove",(e)=>{
    if(!playing || !dragging) return;

    setJetPosition(e.clientX);
});

window.addEventListener("mouseup",()=>{
    dragging = false;
});

fireButton.addEventListener("touchstart",(e)=>{
    e.preventDefault();

    fireHeld = true;
    fire();
},{passive:false});

fireButton.addEventListener("touchend",(e)=>{
    e.preventDefault();

    fireHeld = false;
},{passive:false});

fireButton.addEventListener("mousedown",()=>{
    fireHeld = true;
    fire();
});

window.addEventListener("mouseup",()=>{
    fireHeld = false;
});

document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
        fireHeld = false;
    }
});

if(window.Telegram && window.Telegram.WebApp){
    try{
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }catch(e){}
}
</script>

</body>
</html>
